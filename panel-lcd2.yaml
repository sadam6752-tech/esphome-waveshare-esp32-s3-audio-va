###############################################################################
# Waveshare ESP32-S3-Touch-LCD-2 (2 inch, 240x320 ST7789T3, touch CST816D) as a TILE PANEL for
# ioBroker.satellite-display: no microphone and no speaker on this board, so no voice assistant.
# Clock, up to four pages of tiles and the screen lock, the same components as the voice firmware
# (components/tiles, components/screenlock; format docs/TILES.md). Landscape 320x240, like the 2.8 inch
# display of the voice satellite, so the tiles and the editor of the adapter work unchanged.
#
# Pins (schematic ESP32-S3-Touch-LCD-2): LCD SCLK GPIO39, MOSI GPIO38, CS GPIO45, DC GPIO42, backlight GPIO1,
# LCD reset on the BOOT net (GPIO0, not driven); touch and IMU on I2C SDA GPIO48, SCL GPIO47, touch INT
# GPIO46; TF card MISO GPIO40, CS GPIO41; battery ADC GPIO5.
#
# Build: esphome run panel-lcd2.yaml (needs secrets.yaml with wifi_ssid / wifi_password).
# Tested 2026-11-10 on the board: display (BGR), touch, tiles from the adapter, screen lock.
# Optional sound: a MAX98357A I2S amplifier on the header P2 (BCLK GPIO13, LRC GPIO12, DIN GPIO14, VIN 5V, GND;
# these are camera data lines, so only without a camera). ioBroker.satellite-display plays a URL on it
# (state satellites.<name>.media.url), e.g. the stream of an AirPlay receiver.
# Pages: system <-swipe- clock -swipe-> tiles 1..4; settings (gear): brightness, screen off after, language.
###############################################################################

substitutions:
  name: sd-panel
  friendly_name: "Tile Panel"
  # Language of the clock and the keypad at the first start (Deutsch, English, Русский)
  display_language: Deutsch
  timezone: Europe/Berlin
  build_path: .esphome/build/sd-panel

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.10.0
  # short on Windows: the paths of ESP-IDF in .esphome/build/... grow too long
  build_path: ${build_path}
  project:
    name: sadam6752-tech.tile-panel-lcd2
    version: 0.1.0-dev
  on_boot:
    - priority: -150
      then:
        - lambda: |-
            tiles::Fonts fonts;
            fonts.label = id(font_tile_label)->get_lv_font();
            fonts.small = id(font_small)->get_lv_font();
            fonts.medium = id(font_text)->get_lv_font();
            fonts.large = id(font_value)->get_lv_font();
            fonts.icons = id(font_icons)->get_lv_font();
            fonts.icons_small = id(font_icons_small)->get_lv_font();
            tiles::get().setup(id(page_tiles_1)->obj, id(page_tiles_2)->obj, id(page_tiles_3)->obj,
                               id(page_tiles_4)->obj, fonts,
                               [](int page, int slot, const char *input, float value) {
                                 id(send_tile_input).execute(page, slot, std::string(input), value);
                               });
            screenlock::Fonts lock_fonts;
            lock_fonts.digits = id(font_value)->get_lv_font();
            lock_fonts.text = id(font_small)->get_lv_font();
            lock_fonts.icons = id(font_icons)->get_lv_font();
            screenlock::get().setup(lock_fonts, [](bool locked, int failed) {
              id(send_lock_state).execute(locked, failed);
            });
        - light.turn_on:
            id: lcd_backlight
            brightness: !lambda return id(lcd_brightness).state / 100.0f;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Unencrypted like the voice satellite: ioBroker.satellite-display needs only the IP address.
api:
  # the panel keeps running when ioBroker is away
  reboot_timeout: 0s
  actions:
    # The player from ioBroker (ioBroker.satellite-display, states satellites.<name>.media.*).
    - action: media_play
      variables:
        url: string
      then:
        - media_player.play_media:
            id: player
            media_url: !lambda return url;
    - action: media_stop
      then:
        - media_player.stop: player
    - action: media_title
      variables:
        title: string
      then:
        - lambda: id(media_title) = title.substr(0, 48);
    - action: media_volume
      variables:
        volume: int
      then:
        - media_player.volume_set:
            id: player
            volume: !lambda return std::min(100, std::max(0, int(volume))) / 100.0f;
    # Brightness from ioBroker (ioBroker.satellite-display, state satellites.<name>.brightness): 0 = dark.
    - action: display_brightness
      variables:
        brightness: int
      then:
        - if:
            condition:
              lambda: return brightness <= 0;
            then:
              - light.turn_off: lcd_backlight
            else:
              - number.set:
                  id: lcd_brightness
                  value: !lambda return std::min(100, std::max(5, int(brightness)));
    - action: tile_set
      variables:
        page: int
        slot: int
        col: int
        row: int
        size: string
        type: string
        label: string
        unit: string
        icon: string
        decimals: int
        min: float
        max: float
      then:
        - lambda: tiles::get().set(page, slot, col, row, size, type, label, unit, icon, decimals, min, max);
    - action: tile_value
      variables:
        page: int
        slot: int
        value: float
      then:
        - lambda: tiles::get().set_value(page, slot, value);
    - action: tile_text
      variables:
        page: int
        slot: int
        value: string
      then:
        - lambda: tiles::get().set_text(page, slot, value);
    - action: tile_state
      variables:
        page: int
        slot: int
        "on": bool
      then:
        - lambda: tiles::get().set_state(page, slot, on);
    - action: tile_color
      variables:
        page: int
        slot: int
        color: int
      then:
        - lambda: tiles::get().set_color(page, slot, color);
    - action: tile_background
      variables:
        page: int
        slot: int
        color: int
      then:
        - lambda: tiles::get().set_background(page, slot, color);
    - action: tile_toggle
      variables:
        page: int
        slot: int
        show: bool
      then:
        - lambda: tiles::get().set_toggle(page, slot, show);
    - action: tile_setpoint
      variables:
        page: int
        slot: int
        value: float
        step: float
      then:
        - lambda: tiles::get().set_setpoint(page, slot, value, step);
    - action: tile_history
      variables:
        page: int
        slot: int
        points: float[]
      then:
        - lambda: |-
            std::vector<float> values;
            for (size_t i = 0; i < points.size(); i++) values.push_back(points[i]);
            tiles::get().set_history(page, slot, values);
    - action: tile_clear
      variables:
        page: int
      then:
        - lambda: tiles::get().clear(page);
    # Screen lock (docs/TILES.md "Screen lock"): pin_hash = SHA-256 of "satellite-display:" + PIN, 64 hex digits;
    # mode 0 = after `minutes` without a touch, 1 = when the display goes back to the clock, 2 = only by hand.
    - action: lock_config
      variables:
        enabled: bool
        pin_hash: string
        length: int
        mode: int
        minutes: int
      then:
        - lambda: screenlock::get().configure(enabled, pin_hash, length, mode, minutes);
    - action: lock_set
      variables:
        locked: bool
      then:
        - lambda: screenlock::get().set_locked(locked);

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tile Panel Setup"

captive_portal:

# Wi-Fi over USB: https://web.esphome.io -> Connect -> "Configure Wi-Fi" (no typing on the small screen)
improv_serial:

time:
  - platform: sntp
    id: rtc
    timezone: ${timezone}

external_components:
  - source:
      type: local
      path: components
    components: [tiles, screenlock]

# Tile pages (components/tiles, docs/TILES.md).
tiles:

# Screen lock with a PIN, set from ioBroker (components/screenlock).
screenlock:

spi:
  - id: lcd_spi
    clk_pin: GPIO39
    mosi_pin: GPIO38
    miso_pin: GPIO40
    interface: hardware

i2c:
  - id: bus_i2c
    sda: GPIO48
    scl: GPIO47
    frequency: 400kHz

# Sound (optional): MAX98357A on the header. Mono, one speaker.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO12
    i2s_bclk_pin: GPIO13

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO14
    dac_type: external
    channel: mono
    timeout: never
    buffer_duration: 100ms
  # announcements and media into the one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

# the decoders of the streams (ESPHome 2026.10 builds only the formats asked for; radio is mostly MP3)
audio:
  codecs:
    mp3:
    flac:
    wav:

media_player:
  - platform: speaker
    id: player
    name: "Media player"
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_state:
      - script.execute: send_media_state

# The IMU of the board: which way it stands (the screen turns with it, see the orientation sensor).
motion:
  - platform: qmi8658
    id: imu
    i2c_id: bus_i2c
    address: 0x6B
    update_interval: 500ms

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: lcd_spi
    cs_pin: GPIO45
    dc_pin: GPIO42
    data_rate: 40MHz
    invert_colors: true
    # this panel takes blue first, like the 2.8 inch one (with rgb the blue accent came out orange)
    color_order: bgr
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    display: lcd
    i2c_id: bus_i2c
    interrupt_pin: GPIO46
    on_touch:
      - lambda: id(lcd_last_touch) = millis();
    # a dark screen wakes on the touch; LVGL is paused, so the touch does nothing else
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - light.turn_on:
                id: lcd_backlight
                brightness: !lambda return id(lcd_brightness).state / 100.0f;

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO1
    frequency: 20kHz

light:
  - platform: monochromatic
    id: lcd_backlight
    internal: true
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

select:
  # Read by the lambdas only (no on_value: a restored select fires it during setup).
  - platform: template
    id: display_language
    name: "Display language"
    icon: "mdi:translate"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "${display_language}"
    options: [Deutsch, English, Русский]

sensor:
  # 0 / 90 / 180 / 270 degrees, NAN when it lies flat. On this board 90 = USB right (the screen as built),
  # 270 = USB left (the screen turned by 180 degrees); portrait and flat keep the screen as it is.
  - platform: motion
    motion_id: imu
    type: orientation
    id: imu_orientation
    name: "Orientation"
    entity_category: diagnostic

number:
  # the screen goes dark after this time without a touch; 0 = never
  - platform: template
    id: screen_off_minutes
    name: "Display off after"
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 120
    step: 1
    unit_of_measurement: "min"
  - platform: template
    id: lcd_brightness
    name: "Display brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda return x / 100.0f;

globals:
  - id: lcd_last_touch
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # what plays now (from ioBroker, state satellites.<name>.media.title); empty = "Music"
  - id: media_title
    type: std::string
    restore_value: false
  # restart asked once on the system page (a second tap within 4 s restarts)
  - id: restart_asked
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # the display just went back to the clock by itself (for the screen lock)
  - id: back_to_clock
    type: bool
    restore_value: false
    initial_value: 'false'

font:
  - file: "gfonts://Roboto@500"
    id: font_clock
    size: 96
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@500"
    id: font_value
    size: 34
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_date
    size: 24
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_text
    size: 22
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  # names of the tiles
  - file: "gfonts://Roboto"
    id: font_tile_label
    size: 15
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  # Icons (Material Design Icons): microphone, microphone-off, dots, volume-high, wifi-off, lan-disconnect,
  # alert-circle, cog, chevron-left, alarm, wifi, play, pause, stop, volume, then the icons of the tiles
  # (the list in components/tiles/tiles.cpp and docs/TILES.md).
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 30
    glyphs: ["\U000F036C", "\U000F036D", "\U000F01D8", "\U000F057E", "\U000F05AA", "\U000F0319", "\U000F0028",
             "\U000F0493", "\U000F0141", "\U000F0020", "\U000F05A9",
             "\U000F040A", "\U000F03E4", "\U000F04DB", "\U000F075E", "\U000F075D",
             "\U000F0335", "\U000F06B5", "\U000F0769", "\U000F06A5", "\U000F0425", "\U000F0210", "\U000F0438", "\U000F050F",
             "\U000F058E", "\U000F0241", "\U000F0A72", "\U000F0079", "\U000F05AE", "\U000F05B1", "\U000F081A", "\U000F06D9",
             "\U000F00AC", "\U000F033E", "\U000F033F", "\U000F009A", "\U000F0502", "\U000F0381", "\U000F075A", "\U000F04C3",
             "\U000F0176", "\U000F072A", "\U000F0AAC", "\U000F010B", "\U000F02DC", "\U000F02E3", "\U000F04B9", "\U000F09A0",
             "\U000F0599", "\U000F0594", "\U000F012C", "\U000F0156",
             "\U000F0374", "\U000F0415", "\U000F006E", "\U000F0140"]
  # minus and plus of a square thermostat tile, smaller
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_small
    size: 20
    glyphs: ["\U000F0374", "\U000F0415"]

lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [touch]
  rotation: 90
  buffer_size: 25%
  theme:
    slider:
      bg_color: 0x334155
      indicator:
        bg_color: 0x38BDF8
      knob:
        bg_color: 0xFFFFFF
  pages:
    - id: page_clock
      bg_color: 0x000000
      scrollable: false
      on_swipe_right:
        - if:
            condition:
              lambda: return !screenlock::get().locked();
            then:
              - lvgl.page.show:
                  id: page_system
                  animation: MOVE_RIGHT
                  time: 200ms
      on_swipe_left:
        - lambda: if (!screenlock::get().locked()) id(show_tile_page).execute(tiles::get().next_page(0, 1), true);
      widgets:
        - button:
            id: btn_settings
            align: TOP_LEFT
            x: 2
            y: 2
            width: 48
            height: 44
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - lvgl.page.show:
                  id: page_settings
                  animation: FADE_IN
                  time: 150ms
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0x64748B
                  text: "\U000F0493"
        - button:
            id: btn_lock
            hidden: true
            align: TOP_LEFT
            x: 50
            y: 2
            width: 48
            height: 44
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - lambda: screenlock::get().set_locked(true);
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0x64748B
                  text: "\U000F033F"
        - label:
            id: lbl_locked
            hidden: true
            align: TOP_LEFT
            x: 11
            y: 9
            text_font: font_icons
            text_color: 0x64748B
            text: "\U000F033E"
        - label:
            id: lbl_time
            align: CENTER
            y: -20
            text_font: font_clock
            text_color: 0xFFFFFF
            text: "--:--"
        - label:
            id: lbl_date
            align: CENTER
            y: 60
            width: 100%
            long_mode: DOT
            text_align: CENTER
            text_font: font_date
            text_color: 0xA0A0A0
            text: ""
        # Now playing (media pipeline: music, radio): title and play/pause, stop, volume.
        - obj:
            id: media_bar
            hidden: true
            align: BOTTOM_MID
            width: 100%
            height: 42
            bg_color: 0x111827
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 2
            scrollable: false
            widgets:
            - label:
                id: lbl_media_title
                align: LEFT_MID
                x: 8
                width: 132
                long_mode: DOT
                text_font: font_small
                text_color: 0xE2E8F0
                text: ""
            - button:
                id: btn_media_play
                align: RIGHT_MID
                x: -138
                width: 40
                height: 38
                pad_all: 0
                bg_color: 0x1E293B
                shadow_width: 0
                on_click:
                  - media_player.toggle: player
                widgets:
                  - label:
                      id: lbl_media_play
                      align: CENTER
                      text_font: font_icons
                      text_color: 0xFFFFFF
                      text: "\U000F040A"
            - button:
                id: btn_media_stop
                align: RIGHT_MID
                x: -94
                width: 40
                height: 38
                pad_all: 0
                bg_color: 0x1E293B
                shadow_width: 0
                on_click:
                  - media_player.stop: player
                widgets:
                  - label:
                      align: CENTER
                      text_font: font_icons
                      text_color: 0xFFFFFF
                      text: "\U000F04DB"
            - button:
                id: btn_media_down
                align: RIGHT_MID
                x: -50
                width: 40
                height: 38
                pad_all: 0
                bg_color: 0x1E293B
                shadow_width: 0
                on_click:
                  - media_player.volume_down: player
                widgets:
                  - label:
                      align: CENTER
                      text_font: font_icons
                      text_color: 0xFFFFFF
                      text: "\U000F075E"
            - button:
                id: btn_media_up
                align: RIGHT_MID
                x: -6
                width: 40
                height: 38
                pad_all: 0
                bg_color: 0x1E293B
                shadow_width: 0
                on_click:
                  - media_player.volume_up: player
                widgets:
                  - label:
                      align: CENTER
                      text_font: font_icons
                      text_color: 0xFFFFFF
                      text: "\U000F075D"
        # last widget, so it lies over all others: while locked a touch opens the keypad
        - obj:
            id: lock_catcher
            hidden: true
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            scrollable: false
            on_press:
              - lambda: screenlock::get().on_clock_touched();

    # System: firmware, Wi-Fi, IP, uptime, memory, connection to ioBroker, restart.
    - id: page_system
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lvgl.page.show:
            id: page_clock
            animation: MOVE_LEFT
            time: 200ms
      widgets:
        - label:
            id: lbl_system_title
            align: TOP_LEFT
            x: 14
            y: 12
            text_font: font_text
            text_color: 0xFFFFFF
            text: "System"
        - label:
            id: lbl_system
            align: TOP_LEFT
            x: 14
            y: 46
            width: 292
            long_mode: WRAP
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - button:
            id: btn_restart
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            width: 130
            height: 34
            pad_all: 2
            bg_color: 0x1E293B
            on_click:
              # a touch by mistake should not restart: the first asks, a second within 4 s restarts
              - lambda: |-
                  if (id(restart_asked) != 0 && millis() - id(restart_asked) < 4000) {
                    App.safe_reboot();
                    return;
                  }
                  id(restart_asked) = millis();
            widgets:
              - label:
                  id: lbl_restart_button
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
                  text: "Neustart"

    # Tile pages: what is on them comes from ioBroker (actions tile_*, docs/TILES.md); a page without
    # tiles is skipped.
    - id: page_tiles_1
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(1, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(1, -1), false);
      widgets:
        - arc:
            hidden: true
        - line:
            hidden: true
            points: ["0, 0", "1, 1"]
        # the tiles make switches and bars at run time: one hidden each, so that LVGL compiles them in
        - switch:
            hidden: true
        - bar:
            hidden: true

    - id: page_tiles_2
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(2, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(2, -1), false);

    - id: page_tiles_3
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(3, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(3, -1), false);

    - id: page_tiles_4
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(4, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(4, -1), false);


    - id: page_settings
      bg_color: 0x000000
      scrollable: false
      on_load:
        - lambda: |-
            lv_slider_set_value(id(sl_brightness), int(id(lcd_brightness).state), LV_ANIM_OFF);
            lv_dropdown_set_selected(id(dd_language)->obj, id(display_language).active_index().value_or(0));
            {
              static const int steps[] = {0, 1, 5, 10, 30};
              int m = int(id(screen_off_minutes).state), sel = 0;
              for (int i = 0; i < 5; i++) if (steps[i] == m) sel = i;
              lv_dropdown_set_selected(id(dd_screen_off)->obj, sel);
            }
      widgets:
        - button:
            align: TOP_LEFT
            x: 2
            y: 2
            width: 48
            height: 44
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - lvgl.page.show:
                  id: page_clock
                  animation: FADE_IN
                  time: 150ms
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0xCBD5E1
                  text: "\U000F0141"
        - label:
            id: lbl_settings_title
            x: 56
            y: 12
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
        - label:
            id: lbl_set_brightness
            x: 14
            y: 56
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - slider:
            id: sl_brightness
            x: 18
            y: 86
            width: 284
            height: 12
            min_value: 5
            max_value: 100
            on_release:
              - number.set:
                  id: lcd_brightness
                  value: !lambda return x;
        # two rows: the name left, its list right
        - label:
            id: lbl_set_screen_off
            x: 14
            y: 128
            width: 170
            long_mode: DOT
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - dropdown:
            id: dd_screen_off
            x: 190
            y: 116
            width: 116
            text_font: font_small
            symbol: "\U000F0140"
            indicator:
              text_font: font_icons
            dropdown_list:
              text_font: font_small
            options: ["-", "1 min", "5 min", "10 min", "30 min"]
            on_change:
              - number.set:
                  id: screen_off_minutes
                  value: !lambda |-
                    static const int steps[] = {0, 1, 5, 10, 30};
                    return steps[x < 5 ? x : 0];
        - label:
            id: lbl_set_language
            x: 14
            y: 182
            width: 170
            long_mode: DOT
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - dropdown:
            id: dd_language
            x: 190
            y: 170
            width: 116
            text_font: font_small
            symbol: "\U000F0140"
            indicator:
              text_font: font_icons
            dropdown_list:
              text_font: font_small
            options: [Deutsch, English, Русский]
            on_change:
              - select.set_index:
                  id: display_language
                  index: !lambda return x;

interval:
  - interval: 250ms
    then:
      # Screen lock: keypad timeout, relock, the icons; a locked display shows only the clock.
      - lambda: |-
          auto &lock = screenlock::get();
          size_t lock_lang = id(display_language).active_index().value_or(0) % 3;
          lock.tick(millis() - id(lcd_last_touch), id(back_to_clock), lock_lang);
          id(back_to_clock) = false;
          bool locked = lock.locked();
          auto show = [](lv_obj_t *o, bool visible) {
            if (visible) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          show(id(btn_settings), !locked);
          show(id(lbl_locked), locked);
          show(id(btn_lock), lock.enabled() && !locked);
          show(id(lock_catcher), locked);
          if (locked && !id(page_clock)->is_showing()) {
            id(lvgl_comp)->show_page(id(page_clock)->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          }
      # other pages fall back to the clock after a minute without a touch
      - if:
          condition:
            lambda: return !id(page_clock)->is_showing() && millis() - id(lcd_last_touch) > 60000;
          then:
            - lambda: id(back_to_clock) = true;
            - lvgl.page.show: page_clock
      # dark after the time of the settings without a touch; the next touch wakes it (on_release)
      - if:
          condition:
            lambda: |-
              int m = int(id(screen_off_minutes).state);
              return m > 0 && millis() - id(lcd_last_touch) > uint32_t(m) * 60000u;
          then:
            - if:
                condition:
                  not: lvgl.is_paused
                then:
                  - light.turn_off: lcd_backlight
                  - lvgl.pause:
      # the screen follows the board: a new landscape position counts after 2 s, so a turn in the hand does not flicker
      - lambda: |-
          static int seen = 90, since = 0, shown = 90;
          float o = id(imu_orientation).state;
          if (std::isnan(o)) return;
          int angle = int(o + 0.5f);
          if (angle != 90 && angle != 270) return;
          uint32_t now = millis();
          if (angle != seen) { seen = angle; since = now; return; }
          if (angle != shown && now - uint32_t(since) > 2000) {
            shown = angle;
            id(lvgl_comp)->set_rotation(angle);
            ESP_LOGI("panel", "Screen turned to %d degrees", angle);
          }
      # now playing: the bar at the bottom of the clock
      - lambda: |-
          using media_player::MediaPlayerState;
          static bool shown_bar = false;
          static int shown_play = -1;
          static std::string shown_title = "-";
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          auto mp_state = id(player)->state;
          bool music = mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                       mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PAUSED ||
                       (shown_bar && mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING);
          if (music != shown_bar) {
            shown_bar = music;
            if (music) lv_obj_clear_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            // time and date move up over the bar
            lv_obj_align(id(lbl_time), LV_ALIGN_CENTER, 0, music ? -38 : -20);
            lv_obj_align(id(lbl_date), LV_ALIGN_CENTER, 0, music ? 34 : 60);
          }
          int playing = mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ? 1 : 0;
          if (playing != shown_play) {
            shown_play = playing;
            lv_label_set_text(id(lbl_media_play), playing ? "\U000F03E4" : "\U000F040A");
          }
          static const char *const t_music[] = {"Musik", "Music", "Музыка"};
          std::string title = id(media_title).empty() ? t_music[lang] : id(media_title);
          if (title != shown_title) {
            shown_title = title;
            lv_label_set_text(id(lbl_media_title), title.c_str());
          }
      # a tile page that lost its tiles: back to the clock
      - lambda: |-
          lvgl::LvPageType *pages[] = {id(page_tiles_1), id(page_tiles_2), id(page_tiles_3), id(page_tiles_4)};
          for (int p = 1; p <= 4; p++) {
            if (pages[p - 1]->is_showing() && !tiles::get().page_used(p)) id(show_tile_page).execute(0, false);
          }
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto now = id(rtc).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            static const char *const days[3][7] = {
                {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"},
                {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"},
                {"воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"}};
            static const char *const months[3][12] = {
                {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober",
                 "November", "Dezember"},
                {"January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                 "November", "December"},
                {"января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября",
                 "ноября", "декабря"}};
            auto now = id(rtc).now();
            if (!now.is_valid()) return std::string("");
            size_t lang = id(display_language).active_index().value_or(0) % 3;
            const char *day = days[lang][now.day_of_week - 1];
            const char *month = months[lang][now.month - 1];
            char buf[64];
            // without the year: "Donnerstag, 30. September 2026" does not fit 320 px
            if (lang == 0) snprintf(buf, sizeof(buf), "%s, %d. %s", day, now.day_of_month, month);
            else if (lang == 1) snprintf(buf, sizeof(buf), "%s, %s %d", day, month, now.day_of_month);
            else snprintf(buf, sizeof(buf), "%s, %d %s", day, now.day_of_month, month);
            return std::string(buf);
      - lambda: |-
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          static const char *const t_settings[] = {"Einstellungen", "Settings", "Настройки"};
          static const char *const t_bright[] = {"Helligkeit", "Brightness", "Яркость"};
          static const char *const t_off[] = {"Bildschirm aus nach", "Screen off after", "Экран гаснет через"};
          static const char *const t_lang[] = {"Sprache", "Language", "Язык"};
          lv_label_set_text(id(lbl_settings_title), t_settings[lang]);
          lv_label_set_text(id(lbl_set_brightness), t_bright[lang]);
          lv_label_set_text(id(lbl_set_screen_off), t_off[lang]);
          lv_label_set_text(id(lbl_set_language), t_lang[lang]);
          // the restart button: asks once, then waits 4 s for the second tap
          static const char *const t_restart[] = {"Neustart", "Restart", "Перезапуск"};
          static const char *const t_sure[] = {"Nochmal tippen", "Tap again", "Ещё раз"};
          bool asking = id(restart_asked) != 0 && millis() - id(restart_asked) < 4000;
          lv_label_set_text(id(lbl_restart_button), asking ? t_sure[lang] : t_restart[lang]);
      # the system page, while it is shown
      - if:
          condition:
            lambda: return id(page_system)->is_showing();
          then:
            - lambda: |-
                size_t lang = id(display_language).active_index().value_or(0) % 3;
                static const char *const t_up[] = {"Laufzeit", "Uptime", "Работает"};
                static const char *const t_mem[] = {"Speicher frei", "Free memory", "Свободно"};
                static const char *const t_iob[] = {"ioBroker", "ioBroker", "ioBroker"};
                static const char *const t_yes[] = {"verbunden", "connected", "подключён"};
                static const char *const t_no[] = {"getrennt", "disconnected", "нет связи"};
                static const char *const t_title[] = {"System", "System", "Система"};
                auto *wifi = wifi::global_wifi_component;
                std::string ip = "-";
                if (wifi->is_connected()) {
                  for (auto &addr : wifi->get_ip_addresses()) {
                    if (addr.is_ip4()) { char b[network::IP_ADDRESS_BUFFER_SIZE]; ip = addr.str_to(b); break; }
                  }
                }
                uint32_t s = uint32_t(esp_timer_get_time() / 1000000ULL);
                char up[32];
                snprintf(up, sizeof(up), "%ud %02u:%02u", unsigned(s / 86400), unsigned(s / 3600 % 24), unsigned(s / 60 % 60));
                char ssid[wifi::SSID_BUFFER_SIZE] = "-";
                if (wifi->is_connected()) wifi->wifi_ssid_to(ssid);
                #ifdef ESPHOME_PROJECT_VERSION
                const char *firmware = ESPHOME_PROJECT_VERSION;
                #else
                const char *firmware = __DATE__;
                #endif
                char buf[400];
                snprintf(buf, sizeof(buf),
                         "Panel %s (ESPHome %s)\nWi-Fi: %s (%d dBm)\nIP: %s\n%s: %s\n%s: %u KB RAM, %u KB PSRAM\n%s: %s",
                         firmware, ESPHOME_VERSION, ssid, int(wifi->wifi_rssi()), ip.c_str(), t_up[lang], up, t_mem[lang],
                         unsigned(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                         unsigned(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024), t_iob[lang],
                         api::global_api_server->is_connected() ? t_yes[lang] : t_no[lang]);
                lv_label_set_text(id(lbl_system), buf);
                lv_label_set_text(id(lbl_system_title), t_title[lang]);

script:
  # what the player does, to ioBroker (playing / paused / idle, volume 0..100)
  - id: send_media_state
    mode: queued
    then:
      - homeassistant.event:
          event: esphome.media_state
          data:
            state: !lambda |-
              switch (id(player)->state) {
                case media_player::MEDIA_PLAYER_STATE_PLAYING: return std::string("playing");
                case media_player::MEDIA_PLAYER_STATE_PAUSED: return std::string("paused");
                case media_player::MEDIA_PLAYER_STATE_ANNOUNCING: return std::string("announcing");
                default: return std::string("idle");
              }
            volume: !lambda return to_string(int(id(player)->volume * 100 + 0.5f));
  - id: show_tile_page
    parameters:
      page: int
      left: bool
    then:
      - lambda: |-
          lvgl::LvPageType *pages[] = {id(page_clock), id(page_tiles_1), id(page_tiles_2), id(page_tiles_3),
                                 id(page_tiles_4)};
          if (page < 0 || page > 4) return;
          id(lvgl_comp)->show_page(pages[page]->index,
                                   left ? LV_SCREEN_LOAD_ANIM_MOVE_LEFT : LV_SCREEN_LOAD_ANIM_MOVE_RIGHT, 200);
  # The screen lock changed or a PIN was wrong, to ioBroker (ioBroker.satellite-display).
  - id: send_lock_state
    mode: queued
    parameters:
      locked: bool
      failed: int
    then:
      - homeassistant.event:
          event: esphome.screen_lock
          data:
            locked: !lambda 'return std::string(locked ? "1" : "0");'
            failed: !lambda return to_string(failed);
  # A touch on a tile, to ioBroker (ioBroker.satellite-display); docs/TILES.md.
  - id: send_tile_input
    parameters:
      page: int
      slot: int
      input: string
      value: float
    then:
      - homeassistant.event:
          event: esphome.tile_input
          data:
            page: !lambda return to_string(page);
            slot: !lambda return to_string(slot);
            input: !lambda return input;
            value: !lambda return str_sprintf("%g", value);
