    # System: firmware, Wi-Fi, IP, uptime, memory, connection to ioBroker, restart, and the firmware update
    # (only the ready-made firmware, release-panel.yaml, has the update entity; the button shows a newer release).
    - id: page_system
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lvgl.widget.hide: restart_dialog
        - lvgl.page.show:
            id: page_clock
            animation: MOVE_LEFT
            time: 200ms
      widgets:
        - label:
            id: lbl_system_title
            align: TOP_LEFT
            x: 14
            y: 12
            text_font: font_text
            text_color: 0xFFFFFF
            text: "System"
        - label:
            id: lbl_system
            align: TOP_LEFT
            x: 14
            y: 46
            width: 292
            long_mode: WRAP
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - button:
            id: btn_restart
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            width: 130
            height: 34
            pad_all: 2
            bg_color: 0x1E293B
            on_click:
              # a touch by mistake should not restart: ask with Ja / Nein first
              - lambda: id(confirm_update) = false;
              - script.execute: show_question
            widgets:
              - label:
                  id: lbl_restart_button
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
                  text: "Neustart"
        # A newer release (update entity "Firmware" of release-panel.yaml): asks first, like the restart. Top right
        # like "FW Update" on the voice satellite (base/display.yaml).
        - button:
            id: btn_update
            hidden: true
            align: TOP_RIGHT
            x: -10
            y: 8
            width: 130
            height: 32
            pad_all: 2
            bg_color: 0x1D4ED8
            on_click:
              - lambda: id(confirm_update) = true;
              - script.execute: show_question
            widgets:
              - label:
                  id: lbl_update_button
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
                  text: "Update"
        # The question before a restart or an update, as on the voice satellite (base/display.yaml): Ja restarts
        # or installs, Nein or a swipe closes it.
        - obj:
            id: restart_dialog
            hidden: true
            align: CENTER
            width: 100%
            height: 100%
            bg_color: 0x101828
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 14
            scrollable: false
            widgets:
              - label:
                  id: lbl_restart_question
                  align: TOP_MID
                  y: 20
                  width: 100%
                  long_mode: WRAP
                  text_align: CENTER
                  text_font: font_text
                  text_color: 0xFFFFFF
                  text: "Gerät jetzt neu starten?"
              - button:
                  id: btn_restart_yes
                  align: BOTTOM_LEFT
                  x: 10
                  width: 130
                  height: 48
                  bg_color: 0x15803D
                  on_click:
                    - lambda: |-
                        size_t lang = id(display_language).active_index().value_or(0) % 3;
                        static const char *const t_rs[] = {"Neustart ...", "Restarting ...", "Перезапуск ..."};
                        // the download blocks the display: the text stays until the panel restarts by itself
                        static const char *const t_up[] = {"Update wird installiert, bitte nicht ausschalten ...",
                                                           "Installing the update, do not switch off ...",
                                                           "Обновление устанавливается, не выключайте ..."};
                        lv_label_set_text(id(lbl_restart_question), id(confirm_update) ? t_up[lang] : t_rs[lang]);
                        lv_obj_add_flag(id(btn_restart_yes), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(btn_restart_no), LV_OBJ_FLAG_HIDDEN);
                        lv_refr_now(nullptr);
                    - if:
                        condition:
                          lambda: return id(confirm_update);
                        then:
                          - delay: 300ms
                          - lambda: |-
                              id(update_started) = true;
                              #ifdef USE_UPDATE
                              for (auto *u : App.get_updates()) {
                                if (u->state == update::UPDATE_STATE_AVAILABLE) u->perform();
                              }
                              #endif
                        else:
                          - delay: 1s
                          - lambda: App.safe_reboot();
                  widgets:
                    - label:
                        id: lbl_restart_yes
                        align: CENTER
                        text_font: font_text
                        text_color: 0xFFFFFF
                        text: "Ja"
              - button:
                  id: btn_restart_no
                  align: BOTTOM_RIGHT
                  x: -10
                  width: 130
                  height: 48
                  bg_color: 0x334155
                  on_click:
                    - lvgl.widget.hide: restart_dialog
                  widgets:
                    - label:
                        id: lbl_restart_no
                        align: CENTER
                        text_font: font_text
                        text_color: 0xFFFFFF
                        text: "Nein"

    # Tile pages: what is on them comes from ioBroker (actions tile_*, docs/TILES.md); a page without
