###############################################################################
# Waveshare ESP32-S3-Touch-LCD-2 (2 inch, 240x320 ST7789T3, touch CST816D) as a TILE PANEL for
# ioBroker.satellite-display: no microphone and no speaker on this board, so no voice assistant.
# Clock, up to four pages of tiles and the screen lock, the same components as the voice firmware
# (components/tiles, components/screenlock; format docs/TILES.md). Landscape 320x240, like the 2.8 inch
# display of the voice satellite, so the tiles and the editor of the adapter work unchanged.
#
# Pins (schematic ESP32-S3-Touch-LCD-2): LCD SCLK GPIO39, MOSI GPIO38, CS GPIO45, DC GPIO42, backlight GPIO1,
# LCD reset on the BOOT net (GPIO0, not driven); touch and IMU on I2C SDA GPIO48, SCL GPIO47, touch INT
# GPIO46; TF card MISO GPIO40, CS GPIO41; battery ADC GPIO5.
#
# Build: esphome run panel-lcd2.yaml (needs secrets.yaml with wifi_ssid / wifi_password).
# Tested 2026-11-10 on the board: display (BGR), touch, tiles from the adapter, screen lock.
# Optional sound: a MAX98357A I2S amplifier on the header P2 (BCLK GPIO13, LRC GPIO12, DIN GPIO14, VIN 5V, GND;
# these are camera data lines, so only without a camera). ioBroker.satellite-display plays a URL on it
# (state satellites.<name>.media.url), e.g. the stream of an AirPlay receiver.
# Pages: system <-swipe- clock -swipe-> tiles 1..4; settings (gear): brightness, screen off after, language.
# Battery: a LiPo on the MX1.25 connector, voltage through a 1:3 divider on GPIO5;
# factor 3.14: with x3 a battery charged on USB read 3.99 V, set to 4.18 V (2026-11-17, no multimeter).
###############################################################################

substitutions:
  name: sd-panel
  friendly_name: "Tile Panel"
  # Language of the clock and the keypad at the first start (Deutsch, English, Русский)
  display_language: Deutsch
  timezone: Europe/Berlin
  build_path: .esphome/build/sd-panel

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.10.0
  # short on Windows: the paths of ESP-IDF in .esphome/build/... grow too long
  build_path: ${build_path}
  project:
    name: sadam6752-tech.tile-panel-lcd2
    version: 0.1.0-dev
  on_boot:
    # While a new firmware is written the main loop is busy and the screen is not redrawn by itself: a listener
    # of every OTA draws the progress at once (lv_refr_now), as on the voice satellite (base/display.yaml).
    # Only where an OTA listener is compiled in (release-panel.yaml: the update entity asks for it).
    - priority: -200
      then:
        - lambda: |-
            #ifdef USE_OTA_STATE_LISTENER
            struct OtaScreen : public ota::OTAGlobalStateListener {
              int shown = -1;
              void on_ota_global_state(ota::OTAState state, float progress, uint8_t error,
                                       ota::OTAComponent *component) override {
                if (state == ota::OTA_STARTED || state == ota::OTA_IN_PROGRESS) {
                  int percent = int(progress);
                  if (state == ota::OTA_STARTED) percent = 0;
                  if (percent == this->shown) return;
                  // not every percent: a redraw costs time while the firmware is written
                  if (this->shown >= 0 && percent < 100 && percent - this->shown < 3) return;
                  this->shown = percent;
                  id(show_ota_screen).execute(percent);
                } else if (state == ota::OTA_ERROR || state == ota::OTA_ABORT) {
                  this->shown = -1;
                  id(show_ota_screen).execute(-1);
                }
              }
            };
            static OtaScreen listener;
            ota::get_global_ota_callback()->add_global_state_listener(&listener);
            #endif
    - priority: -150
      then:
        - lambda: |-
            tiles::Fonts fonts;
            fonts.label = id(font_tile_label)->get_lv_font();
            fonts.small = id(font_small)->get_lv_font();
            fonts.medium = id(font_text)->get_lv_font();
            fonts.large = id(font_value)->get_lv_font();
            fonts.icons = id(font_icons)->get_lv_font();
            fonts.icons_small = id(font_icons_small)->get_lv_font();
            tiles::get().setup(id(page_tiles_1)->obj, id(page_tiles_2)->obj, id(page_tiles_3)->obj,
                               id(page_tiles_4)->obj, fonts,
                               [](int page, int slot, const char *input, float value) {
                                 id(send_tile_input).execute(page, slot, std::string(input), value);
                               });
            screenlock::Fonts lock_fonts;
            lock_fonts.digits = id(font_value)->get_lv_font();
            lock_fonts.text = id(font_small)->get_lv_font();
            lock_fonts.icons = id(font_icons)->get_lv_font();
            screenlock::get().setup(lock_fonts, [](bool locked, int failed) {
              id(send_lock_state).execute(locked, failed);
            });
        - light.turn_on:
            id: lcd_backlight
            brightness: !lambda return id(lcd_brightness).state / 100.0f;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Unencrypted like the voice satellite: ioBroker.satellite-display needs only the IP address.
api:
  # the panel keeps running when ioBroker is away
  reboot_timeout: 0s
  actions:
    # The player from ioBroker (ioBroker.satellite-display, states satellites.<name>.media.*).
    - action: media_play
      variables:
        url: string
      then:
        # a new stream over a playing one (radio MP3 44.1 kHz -> AirPlay FLAC 48 kHz) kept the old resampling: it
        # played too fast and choppy. Stop first, wait until the player is idle, then start the new one.
        - if:
            condition:
              not: media_player.is_idle
            then:
              - media_player.stop: player
              - wait_until:
                  condition: media_player.is_idle
                  timeout: 5s
              - script.execute:
                  id: unstick_player
                  next_url: !lambda return url;
              - delay: 200ms
        - media_player.play_media:
            id: player
            media_url: !lambda return url;
    - action: media_stop
      then:
        - media_player.stop: player
        - wait_until:
            condition: media_player.is_idle
            timeout: 5s
        - script.execute:
            id: unstick_player
            next_url: ""
    - action: media_title
      variables:
        title: string
      then:
        - lambda: id(media_title) = title.substr(0, 48);
    - action: media_volume
      variables:
        volume: int
      then:
        - media_player.volume_set:
            id: player
            volume: !lambda return std::min(100, std::max(0, int(volume))) / 100.0f;
    # Brightness from ioBroker (ioBroker.satellite-display, state satellites.<name>.brightness): 0 = dark.
    - action: display_brightness
      variables:
        brightness: int
      then:
        - if:
            condition:
              lambda: return brightness <= 0;
            then:
              - light.turn_off: lcd_backlight
            else:
              - number.set:
                  id: lcd_brightness
                  value: !lambda return std::min(100, std::max(5, int(brightness)));
    - action: tile_set
      variables:
        page: int
        slot: int
        col: int
        row: int
        size: string
        type: string
        label: string
        unit: string
        icon: string
        decimals: int
        min: float
        max: float
      then:
        - lambda: tiles::get().set(page, slot, col, row, size, type, label, unit, icon, decimals, min, max);
    - action: tile_value
      variables:
        page: int
        slot: int
        value: float
      then:
        - lambda: tiles::get().set_value(page, slot, value);
    - action: tile_text
      variables:
        page: int
        slot: int
        value: string
      then:
        - lambda: tiles::get().set_text(page, slot, value);
    - action: tile_state
      variables:
        page: int
        slot: int
        "on": bool
      then:
        - lambda: tiles::get().set_state(page, slot, on);
    - action: tile_color
      variables:
        page: int
        slot: int
        color: int
      then:
        - lambda: tiles::get().set_color(page, slot, color);
    - action: tile_background
      variables:
        page: int
        slot: int
        color: int
      then:
        - lambda: tiles::get().set_background(page, slot, color);
    - action: tile_toggle
      variables:
        page: int
        slot: int
        show: bool
      then:
        - lambda: tiles::get().set_toggle(page, slot, show);
    - action: tile_setpoint
      variables:
        page: int
        slot: int
        value: float
        step: float
      then:
        - lambda: tiles::get().set_setpoint(page, slot, value, step);
    - action: tile_history
      variables:
        page: int
        slot: int
        points: float[]
      then:
        - lambda: |-
            std::vector<float> values;
            for (size_t i = 0; i < points.size(); i++) values.push_back(points[i]);
            tiles::get().set_history(page, slot, values);
    - action: tile_clear
      variables:
        page: int
      then:
        - lambda: tiles::get().clear(page);
    # The items of group, level and battery tiles (docs/TILES.md "Items"): index 0-3.
    - action: tile_item
      variables:
        page: int
        slot: int
        index: int
        label: string
        unit: string
        decimals: int
      then:
        - lambda: tiles::get().set_item(page, slot, index, label, unit, decimals);
    - action: tile_item_value
      variables:
        page: int
        slot: int
        index: int
        value: float
      then:
        - lambda: tiles::get().set_item_value(page, slot, index, value);
    - action: tile_item_text
      variables:
        page: int
        slot: int
        index: int
        value: string
      then:
        - lambda: tiles::get().set_item_text(page, slot, index, value);
    - action: tile_item_color
      variables:
        page: int
        slot: int
        index: int
        color: int
      then:
        - lambda: tiles::get().set_item_color(page, slot, index, color);
    # Screen lock (docs/TILES.md "Screen lock"): pin_hash = SHA-256 of "satellite-display:" + PIN, 64 hex digits;
    # mode 0 = after `minutes` without a touch, 1 = when the display goes back to the clock, 2 = only by hand.
    - action: lock_config
      variables:
        enabled: bool
        pin_hash: string
        length: int
        mode: int
        minutes: int
      then:
        - lambda: screenlock::get().configure(enabled, pin_hash, length, mode, minutes);
    - action: lock_set
      variables:
        locked: bool
      then:
        - lambda: screenlock::get().set_locked(locked);

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tile Panel Setup"

captive_portal:

# Wi-Fi over USB: https://web.esphome.io -> Connect -> "Configure Wi-Fi" (no typing on the small screen)
improv_serial:

time:
  - platform: sntp
    id: rtc
    timezone: ${timezone}

external_components:
  - source:
      type: local
      path: components
    components: [tiles, screenlock]

# Tile pages (components/tiles, docs/TILES.md).
tiles:

# Screen lock with a PIN, set from ioBroker (components/screenlock).
screenlock:

spi:
  - id: lcd_spi
    clk_pin: GPIO39
    mosi_pin: GPIO38
    miso_pin: GPIO40
    interface: hardware

i2c:
  - id: bus_i2c
    sda: GPIO48
    scl: GPIO47
    frequency: 400kHz

# Sound (optional): MAX98357A on the header. Mono, one speaker.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO12
    i2s_bclk_pin: GPIO13

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO14
    dac_type: external
    channel: mono
    # one fixed rate for the whole chain (the default would be 16 kHz): FLAC from AirPlay comes at 48 kHz, an MP3
    # radio at 44.1 kHz is resampled once
    sample_rate: 48000
    bits_per_sample: 16bit
    timeout: never
    buffer_duration: 500ms
  # announcements and media into the one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

# the decoders of the streams (ESPHome 2026.10 builds only the formats asked for; radio is mostly MP3)
audio:
  codecs:
    mp3:
    flac:
    wav:

media_player:
  - platform: speaker
    id: player
    name: "Media player"
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_state:
      - script.execute: send_media_state

# The IMU of the board: which way it stands (the screen turns with it, see the orientation sensor).
motion:
  - platform: qmi8658
    id: imu
    i2c_id: bus_i2c
    address: 0x6B
    update_interval: 500ms

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: lcd_spi
    cs_pin: GPIO45
    dc_pin: GPIO42
    data_rate: 40MHz
    invert_colors: true
    # this panel takes blue first, like the 2.8 inch one (with rgb the blue accent came out orange)
    color_order: bgr
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    display: lcd
    i2c_id: bus_i2c
    interrupt_pin: GPIO46
    on_touch:
      - lambda: id(lcd_last_touch) = millis();
    # a dark screen wakes on the touch; LVGL is paused, so the touch does nothing else
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - light.turn_on:
                id: lcd_backlight
                brightness: !lambda return id(lcd_brightness).state / 100.0f;

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO1
    frequency: 20kHz

light:
  - platform: monochromatic
    id: lcd_backlight
    internal: true
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

select:
  # Read by the lambdas only (no on_value: a restored select fires it during setup).
  - platform: template
    id: display_language
    name: "Display language"
    icon: "mdi:translate"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "${display_language}"
    options: [Deutsch, English, Русский]

sensor:
  # 0 / 90 / 180 / 270 degrees, NAN when it lies flat. On this board 90 = USB right (the screen as built),
  # 270 = USB left (the screen turned by 180 degrees); portrait and flat keep the screen as it is.
  - platform: motion
    motion_id: imu
    type: orientation
    id: imu_orientation
    name: "Orientation"
    entity_category: diagnostic
  # Battery (LiPo on the MX1.25 connector): its voltage through a 1:3 divider on GPIO5 (schematic of the board).
  - platform: adc
    pin: GPIO5
    id: battery_voltage
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: diagnostic
    filters:
      # 3 by the divider, calibrated: a full battery on USB read 3.99 V with x3 (4.18 V expected)
      - multiply: 3.14
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
  # Charge from the voltage (a LiPo curve, rough); NAN when no battery is found (below 2.5 V or above 4.4 V).
  - platform: template
    id: battery_level
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(battery_voltage).state;
      if (std::isnan(v) || v < 2.5f || v > 4.4f) return NAN;
      // full from 4.15 V: a charged battery rests there on USB, not at 4.20 V
      static const float volts[] = {3.30f, 3.50f, 3.60f, 3.70f, 3.80f, 3.90f, 4.00f, 4.08f, 4.15f};
      static const float level[] = {0, 5, 15, 30, 50, 65, 80, 90, 100};
      if (v <= volts[0]) return 0.0f;
      for (int i = 1; i < 9; i++) {
        if (v <= volts[i]) return level[i - 1] + (level[i] - level[i - 1]) * (v - volts[i - 1]) / (volts[i] - volts[i - 1]);
      }
      return 100.0f;
    on_value:
      - script.execute: show_battery

number:
  # the screen goes dark after this time without a touch; 0 = never
  - platform: template
    id: screen_off_minutes
    name: "Display off after"
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 120
    step: 1
    unit_of_measurement: "min"
  - platform: template
    id: lcd_brightness
    name: "Display brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda return x / 100.0f;

globals:
  - id: lcd_last_touch
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # A stream to start after a restart: the player hung on stopping a stream and the panel restarted itself.
  - id: url_after_restart
    type: std::string
    restore_value: true
    max_restore_data_length: 250
  # what plays now (from ioBroker, state satellites.<name>.media.title); empty = "Music"
  - id: media_title
    type: std::string
    restore_value: false
  # the question on the system page is about the firmware update (Ja installs it), else about a restart
  - id: confirm_update
    type: bool
    restore_value: false
    initial_value: 'false'
  # the update from the question runs; the update entity going back to "available" means it failed
  - id: update_started
    type: bool
    restore_value: false
    initial_value: 'false'
  # the display just went back to the clock by itself (for the screen lock)
  - id: back_to_clock
    type: bool
    restore_value: false
    initial_value: 'false'

font:
  - file: "gfonts://Roboto@500"
    id: font_clock
    size: 96
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@500"
    id: font_value
    size: 34
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_date
    size: 24
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_text
    size: 22
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  # names of the tiles
  - file: "gfonts://Roboto"
    id: font_tile_label
    size: 15
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  # Icons (Material Design Icons): microphone, microphone-off, dots, volume-high, wifi-off, lan-disconnect,
  # alert-circle, cog, chevron-left, alarm, wifi, play, pause, stop, volume, then the icons of the tiles
  # (the list in components/tiles/tiles.cpp and docs/TILES.md).
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 30
    glyphs: ["\U000F036C", "\U000F036D", "\U000F01D8", "\U000F057E", "\U000F05AA", "\U000F0319", "\U000F0028",
             "\U000F0493", "\U000F0141", "\U000F0020", "\U000F05A9",
             "\U000F040A", "\U000F03E4", "\U000F04DB", "\U000F075E", "\U000F075D",
             "\U000F0335", "\U000F06B5", "\U000F0769", "\U000F06A5", "\U000F0425", "\U000F0210", "\U000F0438", "\U000F050F",
             "\U000F058E", "\U000F0241", "\U000F0A72", "\U000F0079", "\U000F05AE", "\U000F05B1", "\U000F081A", "\U000F06D9",
             "\U000F00AC", "\U000F033E", "\U000F033F", "\U000F009A", "\U000F0502", "\U000F0381", "\U000F075A", "\U000F04C3",
             "\U000F0176", "\U000F072A", "\U000F0AAC", "\U000F010B", "\U000F02DC", "\U000F02E3", "\U000F04B9", "\U000F09A0",
             "\U000F0599", "\U000F0594", "\U000F012C", "\U000F0156",
             "\U000F0374", "\U000F0415", "\U000F006E", "\U000F0140"]
  # minus and plus of a square thermostat tile and the bolt of a small battery tile, smaller; the battery on the clock (10 % steps, full, alert)
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_small
    size: 20
    glyphs: ["\U000F0374", "\U000F0415", "\U000F0241",
             "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D", "\U000F007E", "\U000F007F", "\U000F0080",
             "\U000F0081", "\U000F0082", "\U000F0079", "\U000F0083"]

lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [touch]
  rotation: 90
  buffer_size: 25%
  theme:
    slider:
      bg_color: 0x334155
      indicator:
        bg_color: 0x38BDF8
      knob:
        bg_color: 0xFFFFFF
  top_layer:
    widgets:
      # A new firmware is being written: do not switch off (blue), with its progress (script show_ota_screen).
      - obj:
          id: ota_box
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x1D4ED8
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 14
          scrollable: false
          widgets:
            - label:
                id: lbl_ota_text
                align: TOP_MID
                y: 6
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
            - bar:
                id: ota_bar
                align: BOTTOM_MID
                y: -40
                width: 260
                height: 14
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x1E3A8A
                indicator:
                  bg_color: 0xFFFFFF
            - label:
                id: lbl_ota_percent
                align: BOTTOM_MID
                y: -6
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
  pages:
    - id: page_clock
      bg_color: 0x000000
      scrollable: false
      on_swipe_right:
        - if:
            condition:
              lambda: return !screenlock::get().locked();
            then:
              - lvgl.page.show:
                  id: page_system
                  animation: MOVE_RIGHT
                  time: 200ms
      on_swipe_left:
        - lambda: if (!screenlock::get().locked()) id(show_tile_page).execute(tiles::get().next_page(0, 1), true);
      widgets:
        - button:
            id: btn_settings
            align: TOP_LEFT
            x: 2
            y: 2
            width: 48
