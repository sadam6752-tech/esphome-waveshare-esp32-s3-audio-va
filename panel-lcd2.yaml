      widgets:
        - arc:
            hidden: true
        - line:
            hidden: true
            points: ["0, 0", "1, 1"]
        # the tiles make switches and bars at run time: one hidden each, so that LVGL compiles them in
        - switch:
            hidden: true
        - bar:
            hidden: true

    - id: page_tiles_2
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(2, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(2, -1), false);

    - id: page_tiles_3
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(3, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(3, -1), false);

    - id: page_tiles_4
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lambda: |-
            int p = tiles::get().next_page(4, 1);
            if (p != 0) id(show_tile_page).execute(p, true);
      on_swipe_right:
        - lambda: id(show_tile_page).execute(tiles::get().next_page(4, -1), false);


    - id: page_settings
      bg_color: 0x000000
      scrollable: false
      on_load:
        - lambda: |-
            lv_slider_set_value(id(sl_brightness), int(id(lcd_brightness).state), LV_ANIM_OFF);
            lv_dropdown_set_selected(id(dd_language)->obj, id(display_language).active_index().value_or(0));
            {
              static const int steps[] = {0, 1, 5, 10, 30};
              int m = int(id(screen_off_minutes).state), sel = 0;
              for (int i = 0; i < 5; i++) if (steps[i] == m) sel = i;
              lv_dropdown_set_selected(id(dd_screen_off)->obj, sel);
            }
      widgets:
        - button:
            align: TOP_LEFT
            x: 2
            y: 2
            width: 48
            height: 44
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - lvgl.page.show:
                  id: page_clock
                  animation: FADE_IN
                  time: 150ms
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0xCBD5E1
                  text: "\U000F0141"
        - label:
            id: lbl_settings_title
            x: 56
            y: 12
            text_font: font_text
            text_color: 0xFFFFFF
            text: ""
        - label:
            id: lbl_set_brightness
            x: 14
            y: 56
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - slider:
            id: sl_brightness
            x: 18
            y: 86
            width: 284
            height: 12
            min_value: 5
            max_value: 100
            on_release:
              - number.set:
                  id: lcd_brightness
                  value: !lambda return x;
        # two rows: the name left, its list right
        - label:
            id: lbl_set_screen_off
            x: 14
            y: 128
            width: 170
            long_mode: DOT
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - dropdown:
            id: dd_screen_off
            x: 190
            y: 116
            width: 116
            text_font: font_small
            symbol: "\U000F0140"
            indicator:
              text_font: font_icons
            dropdown_list:
              text_font: font_small
            options: ["-", "1 min", "5 min", "10 min", "30 min"]
            on_change:
              - number.set:
                  id: screen_off_minutes
                  value: !lambda |-
                    static const int steps[] = {0, 1, 5, 10, 30};
                    return steps[x < 5 ? x : 0];
        - label:
            id: lbl_set_language
            x: 14
            y: 182
            width: 170
            long_mode: DOT
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - dropdown:
            id: dd_language
            x: 190
            y: 170
            width: 116
            text_font: font_small
            symbol: "\U000F0140"
            indicator:
              text_font: font_icons
            dropdown_list:
              text_font: font_small
            options: [Deutsch, English, Русский]
            on_change:
              - select.set_index:
                  id: display_language
                  index: !lambda return x;

interval:
  - interval: 250ms
    then:
      # Screen lock: keypad timeout, relock, the icons; a locked display shows only the clock.
      - lambda: |-
          auto &lock = screenlock::get();
          size_t lock_lang = id(display_language).active_index().value_or(0) % 3;
          lock.tick(millis() - id(lcd_last_touch), id(back_to_clock), lock_lang);
          id(back_to_clock) = false;
          bool locked = lock.locked();
          auto show = [](lv_obj_t *o, bool visible) {
            if (visible) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          show(id(btn_settings), !locked);
          show(id(lbl_locked), locked);
          show(id(btn_lock), lock.enabled() && !locked);
          show(id(lock_catcher), locked);
          if (locked && !id(page_clock)->is_showing()) {
            id(lvgl_comp)->show_page(id(page_clock)->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          }
      # other pages fall back to the clock after a minute without a touch
      - if:
          condition:
            lambda: return !id(page_clock)->is_showing() && millis() - id(lcd_last_touch) > 60000;
          then:
            - lambda: id(back_to_clock) = true;
            - lvgl.page.show: page_clock
      # dark after the time of the settings without a touch; the next touch wakes it (on_release)
      - if:
          condition:
            lambda: |-
              int m = int(id(screen_off_minutes).state);
              return m > 0 && millis() - id(lcd_last_touch) > uint32_t(m) * 60000u;
          then:
            - if:
                condition:
                  not: lvgl.is_paused
                then:
                  - light.turn_off: lcd_backlight
                  - lvgl.pause:
      # the screen follows the board: a new landscape position counts after 2 s, so a turn in the hand does not flicker
      - lambda: |-
          static int seen = 90, since = 0, shown = 90;
          float o = id(imu_orientation).state;
          if (std::isnan(o)) return;
          int angle = int(o + 0.5f);
          if (angle != 90 && angle != 270) return;
          uint32_t now = millis();
          if (angle != seen) { seen = angle; since = now; return; }
          if (angle != shown && now - uint32_t(since) > 2000) {
            shown = angle;
            id(lvgl_comp)->set_rotation(angle);
            ESP_LOGI("panel", "Screen turned to %d degrees", angle);
          }
      # now playing: the bar at the bottom of the clock
      - lambda: |-
          using media_player::MediaPlayerState;
          static bool shown_bar = false;
          static int shown_play = -1;
          static std::string shown_title = "-";
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          auto mp_state = id(player)->state;
          bool music = mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                       mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PAUSED ||
                       (shown_bar && mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING);
          if (music != shown_bar) {
            shown_bar = music;
            if (music) lv_obj_clear_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            // time and date move up over the bar
            lv_obj_align(id(lbl_time), LV_ALIGN_CENTER, 0, music ? -38 : -20);
            lv_obj_align(id(lbl_date), LV_ALIGN_CENTER, 0, music ? 34 : 60);
          }
          int playing = mp_state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ? 1 : 0;
          if (playing != shown_play) {
            shown_play = playing;
            lv_label_set_text(id(lbl_media_play), playing ? "\U000F03E4" : "\U000F040A");
          }
          static const char *const t_music[] = {"Musik", "Music", "Музыка"};
          std::string title = id(media_title).empty() ? t_music[lang] : id(media_title);
          if (title != shown_title) {
            shown_title = title;
            lv_label_set_text(id(lbl_media_title), title.c_str());
          }
      # a tile page that lost its tiles: back to the clock
      - lambda: |-
          lvgl::LvPageType *pages[] = {id(page_tiles_1), id(page_tiles_2), id(page_tiles_3), id(page_tiles_4)};
          for (int p = 1; p <= 4; p++) {
            if (pages[p - 1]->is_showing() && !tiles::get().page_used(p)) id(show_tile_page).execute(0, false);
          }
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return !id(url_after_restart).empty() && wifi::global_wifi_component->is_connected();
          then:
            - lambda: |-
                std::string url = id(url_after_restart);
                id(url_after_restart) = "";
                ESP_LOGI("panel", "Restarted for a hanging player: plays %s", url.c_str());
                auto call = id(player)->make_call();
                call.set_media_url(url);
                call.perform();
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto now = id(rtc).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            static const char *const days[3][7] = {
                {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"},
                {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"},
                {"воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"}};
            static const char *const months[3][12] = {
                {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober",
                 "November", "Dezember"},
                {"January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                 "November", "December"},
                {"января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября",
                 "ноября", "декабря"}};
            auto now = id(rtc).now();
            if (!now.is_valid()) return std::string("");
            size_t lang = id(display_language).active_index().value_or(0) % 3;
            const char *day = days[lang][now.day_of_week - 1];
            const char *month = months[lang][now.month - 1];
            char buf[64];
            // without the year: "Donnerstag, 30. September 2026" does not fit 320 px
            if (lang == 0) snprintf(buf, sizeof(buf), "%s, %d. %s", day, now.day_of_month, month);
            else if (lang == 1) snprintf(buf, sizeof(buf), "%s, %s %d", day, month, now.day_of_month);
            else snprintf(buf, sizeof(buf), "%s, %d %s", day, now.day_of_month, month);
            return std::string(buf);
      - lambda: |-
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          static const char *const t_settings[] = {"Einstellungen", "Settings", "Настройки"};
          static const char *const t_bright[] = {"Helligkeit", "Brightness", "Яркость"};
          static const char *const t_off[] = {"Bildschirm aus nach", "Screen off after", "Экран гаснет через"};
          static const char *const t_lang[] = {"Sprache", "Language", "Язык"};
          lv_label_set_text(id(lbl_settings_title), t_settings[lang]);
          lv_label_set_text(id(lbl_set_brightness), t_bright[lang]);
          lv_label_set_text(id(lbl_set_screen_off), t_off[lang]);
          lv_label_set_text(id(lbl_set_language), t_lang[lang]);
          // the restart button and its question
          static const char *const t_restart[] = {"Neustart", "Restart", "Перезапуск"};
          static const char *const t_question[] = {"Gerät jetzt neu starten?", "Restart the device now?",
                                                   "Перезапустить устройство сейчас?"};
          static const char *const t_yes[] = {"Ja", "Yes", "Да"};
          static const char *const t_no[] = {"Nein", "No", "Нет"};
          lv_label_set_text(id(lbl_restart_button), t_restart[lang]);
          if (!lv_obj_has_flag(id(btn_restart_yes), LV_OBJ_FLAG_HIDDEN)) {
            if (id(confirm_update)) id(update_question_text).execute();
            else lv_label_set_text(id(lbl_restart_question), t_question[lang]);
          }
          lv_label_set_text(id(lbl_restart_yes), t_yes[lang]);
          lv_label_set_text(id(lbl_restart_no), t_no[lang]);
      # the system page, while it is shown
      - if:
          condition:
            lambda: return id(page_system)->is_showing();
          then:
            - lambda: |-
                size_t lang = id(display_language).active_index().value_or(0) % 3;
                static const char *const t_up[] = {"Laufzeit", "Uptime", "Работает"};
                static const char *const t_mem[] = {"Speicher frei", "Free memory", "Свободно"};
                static const char *const t_iob[] = {"ioBroker", "ioBroker", "ioBroker"};
                static const char *const t_yes[] = {"verbunden", "connected", "подключён"};
                static const char *const t_no[] = {"getrennt", "disconnected", "нет связи"};
                static const char *const t_title[] = {"System", "System", "Система"};
                auto *wifi = wifi::global_wifi_component;
                std::string ip = "-";
                if (wifi->is_connected()) {
                  for (auto &addr : wifi->get_ip_addresses()) {
                    if (addr.is_ip4()) { char b[network::IP_ADDRESS_BUFFER_SIZE]; ip = addr.str_to(b); break; }
                  }
                }
                uint32_t s = uint32_t(esp_timer_get_time() / 1000000ULL);
                char up[32];
                snprintf(up, sizeof(up), "%ud %02u:%02u", unsigned(s / 86400), unsigned(s / 3600 % 24), unsigned(s / 60 % 60));
                char ssid[wifi::SSID_BUFFER_SIZE] = "-";
                if (wifi->is_connected()) wifi->wifi_ssid_to(ssid);
                #ifdef ESPHOME_PROJECT_VERSION
                const char *firmware = ESPHOME_PROJECT_VERSION;
                #else
                const char *firmware = __DATE__;
                #endif
                static const char *const t_bat[] = {"Akku", "Battery", "Батарея"};
                // the battery on the line of the uptime: one more line would reach the restart button
                char bat[48] = "";
                float bv = id(battery_voltage).state, bp = id(battery_level).state;
                if (!std::isnan(bp)) snprintf(bat, sizeof(bat), ", %s %d %% (%.2f V)", t_bat[lang], int(roundf(bp)), bv);
                char buf[440];
                snprintf(buf, sizeof(buf),
                         "Panel %s (ESPHome %s)\nWi-Fi: %s (%d dBm)\nIP: %s\n%s: %s%s\n%s: %u KB RAM, %u KB PSRAM\n%s: %s",
                         firmware, ESPHOME_VERSION, ssid, int(wifi->wifi_rssi()), ip.c_str(), t_up[lang], up, bat, t_mem[lang],
                         unsigned(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                         unsigned(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024), t_iob[lang],
                         api::global_api_server->is_connected() ? t_yes[lang] : t_no[lang]);
                lv_label_set_text(id(lbl_system), buf);
                lv_label_set_text(id(lbl_system_title), t_title[lang]);
                // the firmware update (only in release-panel.yaml)
                #ifdef USE_UPDATE
                static const char *const t_fail[] = {"Update fehlgeschlagen. Später erneut versuchen.",
                                                     "The update failed. Try again later.",
                                                     "Обновление не удалось. Попробуйте позже."};
                for (auto *u : App.get_updates()) {
                  bool available = u->state == update::UPDATE_STATE_AVAILABLE;
                  if (id(update_started) && available) {
                    // back to "available" after perform(): the download or the flashing failed
                    id(update_started) = false;
                    lv_label_set_text(id(lbl_restart_question), t_fail[lang]);
                    lv_obj_clear_flag(id(btn_restart_no), LV_OBJ_FLAG_HIDDEN);
                  }
                  if (available && !id(update_started)) {
                    std::string text = "Update " + u->update_info.latest_version;
                    lv_label_set_text(id(lbl_update_button), text.c_str());
                    lv_obj_clear_flag(id(btn_update), LV_OBJ_FLAG_HIDDEN);
                  } else {
                    lv_obj_add_flag(id(btn_update), LV_OBJ_FLAG_HIDDEN);
                  }
                  break;
                }
                #endif

script:
  # The OTA screen: percent 0..100 while writing, -1 when it failed.
  - id: show_ota_screen
    mode: restart
    parameters:
      percent: int
    then:
      - lambda: |-
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          static const char *const t_busy[] = {
              "Firmware wird aktualisiert!\nBitte nicht vom Strom trennen, das Panel startet danach neu.",
              "Updating the firmware!\nDo not unplug the panel, it restarts by itself when done.",
              "Идёт обновление прошивки!\nНе отключайте питание, панель перезапустится сама."};
          static const char *const t_fail[] = {
              "Update fehlgeschlagen.\nDie bisherige Firmware läuft weiter.",
              "The update failed.\nThe current firmware keeps running.",
              "Обновление не удалось.\nТекущая прошивка продолжает работать."};
          if (percent < 0) {
            lv_label_set_text(id(lbl_ota_text), t_fail[lang]);
            lv_label_set_text(id(lbl_ota_percent), "");
            lv_obj_add_flag(id(ota_bar), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(lbl_ota_text), t_busy[lang]);
            lv_obj_clear_flag(id(ota_bar), LV_OBJ_FLAG_HIDDEN);
            lv_bar_set_value(id(ota_bar), percent, LV_ANIM_OFF);
            lv_label_set_text(id(lbl_ota_percent), (std::to_string(percent) + " %").c_str());
          }
          lv_obj_clear_flag(id(ota_box), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ota_box));
          // a dark screen: LVGL is paused and the backlight off; full light, then draw now (the loop is busy)
          if (id(lvgl_comp)->is_paused()) id(lvgl_comp)->set_paused(false, false);
          auto call = id(lcd_backlight).make_call();
          call.set_state(true).set_brightness(1.0f).set_transition_length(0);
          call.perform();
          id(lcd_last_touch) = millis();
          lv_refr_now(nullptr);
      - if:
          condition:
            lambda: return percent < 0;
          then:
            - delay: 8s
            - lvgl.widget.hide: ota_box
  # The battery on the clock: icon in 10 % steps and the percent; hidden without a battery.
  - id: show_battery
    then:
      - lambda: |-
          float p = id(battery_level).state;
          if (std::isnan(p)) {
            lv_obj_add_flag(id(lbl_battery), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_battery_icon), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          static const char *const icons[] = {"\U000F0083", "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D",
                                              "\U000F007E", "\U000F007F", "\U000F0080", "\U000F0081", "\U000F0082",
                                              "\U000F0079"};
          int step = std::min(10, std::max(0, int(roundf(p / 10.0f))));
          char buf[8];
          snprintf(buf, sizeof(buf), "%d %%", int(roundf(p)));
          lv_label_set_text(id(lbl_battery), buf);
          lv_label_set_text(id(lbl_battery_icon), icons[step]);
          uint32_t color = p < 15 ? 0xF87171 : 0x94A3B8;
          lv_obj_set_style_text_color(id(lbl_battery), lv_color_hex(color), 0);
          lv_obj_set_style_text_color(id(lbl_battery_icon), lv_color_hex(color), 0);
          lv_obj_clear_flag(id(lbl_battery), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(lbl_battery_icon), LV_OBJ_FLAG_HIDDEN);
  # The question of the system page, for a restart or (confirm_update) the firmware update.
  - id: show_question
    then:
      - lambda: |-
          lv_obj_clear_flag(id(btn_restart_yes), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(btn_restart_no), LV_OBJ_FLAG_HIDDEN);
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          static const char *const t_question[] = {"Gerät jetzt neu starten?", "Restart the device now?",
                                                   "Перезапустить устройство сейчас?"};
          lv_label_set_text(id(lbl_restart_question), t_question[lang]);
          if (id(confirm_update)) id(update_question_text).execute();
      - lvgl.widget.show: restart_dialog
  - id: update_question_text
    then:
      - lambda: |-
          size_t lang = id(display_language).active_index().value_or(0) % 3;
          static const char *const t_q[] = {"Firmware %s installieren? Das Panel startet danach neu.",
                                            "Install the firmware %s? The panel restarts afterwards.",
                                            "Установить прошивку %s? Потом панель перезапустится."};
          std::string version = "";
          #ifdef USE_UPDATE
          for (auto *u : App.get_updates()) { version = u->update_info.latest_version; break; }
          #endif
          char buf[160];
          snprintf(buf, sizeof(buf), t_q[lang], version.c_str());
          lv_label_set_text(id(lbl_restart_question), buf);
  # The player can hang while it closes a stream (seen with the stream of ioBroker.spotify-connect: STOP and no
  # IDLE any more, every later URL ignored). Not idle 5 s after a stop: restart, and play next_url afterwards.
  - id: unstick_player
    parameters:
      next_url: string
    then:
      - if:
          condition:
            not: media_player.is_idle
          then:
            - logger.log:
                level: WARN
                format: "The player hangs on stopping a stream: restarting"
            - lambda: id(url_after_restart) = next_url;
            - delay: 100ms
            - lambda: App.safe_reboot();
  # what the player does, to ioBroker (playing / paused / idle, volume 0..100)
  - id: send_media_state
    mode: queued
    then:
      - homeassistant.event:
          event: esphome.media_state
          data:
            state: !lambda |-
              switch (id(player)->state) {
                case media_player::MEDIA_PLAYER_STATE_PLAYING: return std::string("playing");
                case media_player::MEDIA_PLAYER_STATE_PAUSED: return std::string("paused");
                case media_player::MEDIA_PLAYER_STATE_ANNOUNCING: return std::string("announcing");
                default: return std::string("idle");
              }
            volume: !lambda return to_string(int(id(player)->volume * 100 + 0.5f));
  - id: show_tile_page
    parameters:
      page: int
      left: bool
    then:
      - lambda: |-
          lvgl::LvPageType *pages[] = {id(page_clock), id(page_tiles_1), id(page_tiles_2), id(page_tiles_3),
                                 id(page_tiles_4)};
          if (page < 0 || page > 4) return;
          id(lvgl_comp)->show_page(pages[page]->index,
                                   left ? LV_SCREEN_LOAD_ANIM_MOVE_LEFT : LV_SCREEN_LOAD_ANIM_MOVE_RIGHT, 200);
  # The screen lock changed or a PIN was wrong, to ioBroker (ioBroker.satellite-display).
  - id: send_lock_state
    mode: queued
    parameters:
      locked: bool
      failed: int
    then:
      - homeassistant.event:
          event: esphome.screen_lock
          data:
            locked: !lambda 'return std::string(locked ? "1" : "0");'
            failed: !lambda return to_string(failed);
  # A touch on a tile, to ioBroker (ioBroker.satellite-display); docs/TILES.md.
  - id: send_tile_input
    parameters:
      page: int
      slot: int
      input: string
      value: float
    then:
      - homeassistant.event:
          event: esphome.tile_input
          data:
            page: !lambda return to_string(page);
            slot: !lambda return to_string(slot);
            input: !lambda return input;
            value: !lambda return str_sprintf("%g", value);
