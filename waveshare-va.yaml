# =============================================================================
# Waveshare ESP32-S3-AUDIO-Board voice assistant - YOUR config.
# This thin file is the only firmware file you keep locally.
# -----------------------------------------------------------------------------
# Put this file next to a secrets.yaml (copy secrets.example.yaml), edit the
# substitutions below, then:
#
#   esphome run waveshare-va.yaml
#
# Everything else - the core config - is pulled
# from GitHub at compile time (see the `packages:` block), so this is the only
# file you ever maintain. To pick up the latest changes later:
#
#   esphome clean waveshare-va.yaml   # clears the package cache
#   esphome run   waveshare-va.yaml
# =============================================================================

substitutions:
  name: waveshare-va
  friendly_name: "Waveshare Voice"

  # Clock timezone, POSIX form (the device has no IANA database). Copy yours from
  # https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv - DST is
  # then handled automatically. HA can also push a zone via the set_time_zone
  # action, which overrides this and is remembered across reboots.
  posix_timezone: "CET-1CEST,M3.5.0,M10.5.0/3"   # Europe/Berlin

  # Onboard amplifier volume clamps. The little speaker distorts near the top,
  # so the media player is limited to this window (0.0 - 1.0).
  volume_min: '0.4'
  volume_max: '0.8'

  # Set to 'true' only if your SSID is hidden.
  hidden_ssid: 'false'

  # Boot chime played once on connect to Home Assistant. A sound ships with the
  # firmware; uncomment to use your own (any URL or local MP3/FLAC/WAV). The
  # board plays back at 16 kHz mono, so a small 16 kHz mono file is plenty.
  # boot_sound_file: https://example.com/my-chime.mp3

  # Mic gain, LED brightness, wake-word sensitivity and the alarm are all
  # exposed as entities in Home Assistant - no need to reflash to change them.

# The core comes from the local clone (base/core.yaml), not from GitHub: it has
# our own changes to the timer ring (3 s gap, visible switch, 1 min auto-stop).
# Upstream changes: git pull, then build again.
packages:
  core: !include base/core.yaml
  # Waveshare 2.8inch Capacitive Touch LCD (Rev 1.1) on the LCD FPC: clock and date
  display: !include base/display.yaml

# Wi-Fi and the API key come from your local secrets.yaml.

# Windows without long path support: the ESP-IDF build tree under this folder
# gets too deep, so build in a short folder.
esphome:
  build_path: C:/ESPHome/build/waveshare-va

# Own wake word "ioBroker", built into the firmware: the core's models do not
# take models sent over the API. It is added to the core's list; which ones
# listen is chosen in ioBroker.assistant (Satellites tab).
micro_wake_word:
  models:
    - model: wakewords/iobroker.json
      id: iobroker

# No Home Assistant here: the device is driven by ioBroker.assistant, which does
# not answer the time request of the native API. Take the clock from NTP instead
# (same id, so the alarm and the clock entities of the core keep working).
time:
  - id: !extend rtc
    platform: sntp
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# Optional: static IP. Anything you add here is merged into the core config, so
# you only list the extra keys. With manual_ip set, OTA and logs use this IP
# instead of <name>.local, so mDNS isn't needed (you can turn it off below).
# wifi:
#   manual_ip:
#     static_ip: 192.168.1.50
#     gateway: 192.168.1.1
#     subnet: 255.255.255.0
#     dns1: 192.168.1.1
#
# mdns:
#   disabled: true
