###############################################################################
# Waveshare 2.8inch Capacitive Touch LCD (240x320, ST7789, touch CST3530 = Rev 1.1 / V2)
# on the 18-pin LCD FPC of the ESP32-S3-AUDIO-Board. Optional: the core does not need it.
#
# Pages (landscape 320x240):
#   system  <-swipe-  clock  -swipe->  values  -swipe->  switches     settings: the gear on the clock page
# - clock: time, date, alarm, the running timers, the state of the assistant (icon, top right).
# - system: Wi-Fi, IP, uptime, memory, connection to the assistant.
# - values: four numbers that ioBroker writes (entities "Value 1".."Value 4"), labels from substitutions.
# - switches (swipe on from the values): four tiles; a touch switches, ioBroker connects them with its states.
# - settings: volume, display and ring brightness, microphone, night mode, wake sound, language.
# Over every page: the conversation (what was heard, the answer, a question waits for a spoken answer),
# the volume while it changes, and a full-screen "Stop" while a timer or the alarm rings (touch = stop).
# Night mode dims the backlight; a touch lights it for a few seconds. Other pages fall back to the clock
# after a minute without a touch.
#
# Include it from your thin config:
#   packages:
#     core: !include base/core.yaml
#     display: !include base/display.yaml
#
# Pins (board wiki): CS GPIO3, SCK GPIO4, BL GPIO5, DC GPIO7, MOSI GPIO9, RST EXIO0;
# touch on the shared I2C bus at 0x58, TP_RST EXIO1, TP_INT EXIO2 (polled, the expander has no interrupt
# wired to the ESP).
###############################################################################

substitutions:
  # Language of the display at the first start (Deutsch, English, Русский); later the select
  # "Display language" (the satellite does not learn the language of the assistant).
  display_language: Deutsch
  # The values page: what each value is. ioBroker writes the numbers into the entities "Value 1".."Value 4"
  # (assistant.0.satellites.<satellite>.controls.value_1 ...).
  value_1_label: "Wert 1"
  value_1_unit: ""
  value_1_decimals: "1"
  value_2_label: "Wert 2"
  value_2_unit: ""
  value_2_decimals: "1"
  value_3_label: "Wert 3"
  value_3_unit: ""
  value_3_decimals: "1"
  value_4_label: "Wert 4"
  value_4_unit: ""
  value_4_decimals: "1"
  # The switches page: what each switch is. ioBroker connects the entities "Switch 1".."Switch 4"
  # (assistant.0.satellites.<satellite>.controls.switch_1 ...) with its states, both ways.
  switch_1_label: "Schalter 1"
  switch_2_label: "Schalter 2"
  switch_3_label: "Schalter 3"
  switch_4_label: "Schalter 4"

esphome:
  includes:
    - <esp_wifi.h>
  on_boot:
    # While a new firmware is written the main loop is busy and the screen is not redrawn by itself:
    # a listener of every OTA draws the warning and the progress at once (lv_refr_now).
    - priority: -200
      then:
        - lambda: |-
            #ifdef USE_OTA_STATE_LISTENER
            struct OtaScreen : public ota::OTAGlobalStateListener {
              int shown = -1;
              void on_ota_global_state(ota::OTAState state, float progress, uint8_t error,
                                       ota::OTAComponent *component) override {
                if (state == ota::OTA_STARTED || state == ota::OTA_IN_PROGRESS) {
                  int percent = int(progress);
                  if (state == ota::OTA_STARTED) percent = 0;
                  if (percent == this->shown) return;
                  // not every percent: a redraw costs time while the firmware is written
                  if (this->shown >= 0 && percent < 100 && percent - this->shown < 3) return;
                  this->shown = percent;
                  id(show_ota_screen).execute(percent);
                } else if (state == ota::OTA_ERROR || state == ota::OTA_ABORT) {
                  this->shown = -1;
                  id(show_ota_screen).execute(-1);
                }
              }
            };
            static OtaScreen listener;
            ota::get_global_ota_callback()->add_global_state_listener(&listener);
            #endif

ota:
  - id: !extend ota_esphome
    on_end:
      - logger.log: "Firmware written, restarting"

external_components:
  - source:
      type: local
      path: components
    components: [cst3530]

spi:
  - id: lcd_spi
    clk_pin: GPIO4
    mosi_pin: GPIO9
    interface: hardware

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: lcd_spi
    cs_pin: GPIO3
    dc_pin: GPIO7
    reset_pin:
      tca9555: ioexp
      number: 0
    data_rate: 40MHz
    invert_colors: true
    # this panel takes blue first (with rgb, red and blue came out swapped)
    color_order: bgr
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst3530
    id: touch
    display: lcd
    i2c_id: internal_i2c
    reset_pin:
      tca9555: ioexp
      number: 1
    interrupt_pin:
      tca9555: ioexp
      number: 2
    on_touch:
      - lambda: id(lcd_last_touch) = millis();
      - logger.log:
          level: DEBUG
          format: "touch x=%d y=%d"
          args: [touch.x, touch.y]

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO5
    frequency: 20kHz

light:
  # Driven by the two brightness numbers below and night mode (see the interval).
  - platform: monochromatic
    id: lcd_backlight
    internal: true
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

event:
  # A touch on Yes/No while the assistant waits for an answer (object id confirm_answer).
  - platform: template
    id: confirm_answer
    name: "Confirm answer"
    icon: "mdi:gesture-tap-button"
    event_types: ["yes", "no"]

switch:
  - platform: template
    id: switch_1
    name: "Switch 1"
    icon: "mdi:toggle-switch-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: switch_2
    name: "Switch 2"
    icon: "mdi:toggle-switch-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: switch_3
    name: "Switch 3"
    icon: "mdi:toggle-switch-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: switch_4
    name: "Switch 4"
    icon: "mdi:toggle-switch-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  # Read by the lambdas only (no on_value: a restored select fires it during setup).
  - platform: template
    id: display_language
    name: "Display language"
    icon: "mdi:translate"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "${display_language}"
    options: [Deutsch, English, Русский]

number:
  - platform: template
    id: lcd_day_brightness
    name: "Display brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
  # With night mode on (switch of the core); 0 = off. Talking to the assistant, a ringing timer or a touch
  # light the display at day brightness.
  - platform: template
    id: lcd_night_brightness
    name: "Display night brightness"
    icon: "mdi:brightness-4"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
  # The values page. -999999 = no value yet (shown as "–").
  - platform: template
    id: value_1
    name: "Value 1"
    icon: "mdi:numeric-1-box-outline"
    optimistic: true
    restore_value: true
    initial_value: -999999
    min_value: -999999
    max_value: 999999
    step: 0.01
    mode: box
  - platform: template
    id: value_2
    name: "Value 2"
    icon: "mdi:numeric-2-box-outline"
    optimistic: true
    restore_value: true
    initial_value: -999999
    min_value: -999999
    max_value: 999999
    step: 0.01
    mode: box
  - platform: template
    id: value_3
    name: "Value 3"
    icon: "mdi:numeric-3-box-outline"
    optimistic: true
    restore_value: true
    initial_value: -999999
    min_value: -999999
    max_value: 999999
    step: 0.01
    mode: box
  - platform: template
    id: value_4
    name: "Value 4"
    icon: "mdi:numeric-4-box-outline"
    optimistic: true
    restore_value: true
    initial_value: -999999
    min_value: -999999
    max_value: 999999
    step: 0.01
    mode: box

font:
  - file: "gfonts://Roboto@500"
    id: font_clock
    size: 96
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@500"
    id: font_value
    size: 34
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_date
    size: 24
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_text
    size: 22
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  # Icons (Material Design Icons): microphone, microphone-off, dots, volume-high, wifi-off, lan-disconnect,
  # alert-circle, cog, chevron-left, alarm, wifi.
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 30
    glyphs: ["\U000F036C", "\U000F036D", "\U000F01D8", "\U000F057E", "\U000F05AA", "\U000F0319", "\U000F0028",
             "\U000F0493", "\U000F0141", "\U000F0020", "\U000F05A9"]
  - file: "gfonts://Roboto@500"
    id: font_stop
    size: 64
    glyphs: "StopСтп"

lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [touch]
  rotation: 90
  buffer_size: 25%
  theme:
    slider:
      bg_color: 0x334155
      indicator:
        bg_color: 0x38BDF8
      knob:
        bg_color: 0xFFFFFF
    switch:
      bg_color: 0x334155
      indicator:
        checked:
          bg_color: 0x38BDF8
  top_layer:
    widgets:
      # The state of the assistant, over every page.
      - label:
          id: lbl_status
          align: TOP_RIGHT
          x: -8
          y: 6
          text_font: font_icons
          text: ""
      # The conversation: what was heard and the answer; a question waits for a spoken answer.
      - obj:
          id: dialog_box
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x101828
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 12
          scrollable: false
          widgets:
            - label:
                id: lbl_heard
                align: TOP_LEFT
                width: 260
                long_mode: DOT
                text_font: font_small
                text_color: 0x94A3B8
                text: ""
            - label:
                id: lbl_answer
                align: TOP_MID
                y: 30
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
            - label:
                id: lbl_hint
                align: BOTTOM_MID
                y: -58
                hidden: true
                text_font: font_small
                text_color: 0x7DD3FC
                text: ""
            # Answer by touch (ioBroker.assistant 1.4.7+: the event confirm_answer while the question is open).
            - button:
                id: btn_confirm_yes
                hidden: true
                align: BOTTOM_LEFT
                width: 130
                height: 48
                bg_color: 0x15803D
                on_click:
                  - script.execute:
                      id: confirm_by_touch
                      answer: "yes"
                widgets:
                  - label:
                      id: lbl_confirm_yes
                      align: CENTER
                      text_font: font_text
                      text_color: 0xFFFFFF
                      text: "Ja"
            - button:
                id: btn_confirm_no
                hidden: true
                align: BOTTOM_RIGHT
                width: 130
                height: 48
                bg_color: 0xB91C1C
                on_click:
                  - script.execute:
                      id: confirm_by_touch
                      answer: "no"
                widgets:
                  - label:
                      id: lbl_confirm_no
                      align: CENTER
                      text_font: font_text
                      text_color: 0xFFFFFF
                      text: "Nein"
      # The volume while it changes.
      - obj:
          id: volume_box
          hidden: true
          align: BOTTOM_MID
          y: -12
          width: 260
          height: 54
          bg_color: 0x1E293B
          bg_opa: COVER
          border_width: 0
          radius: 12
          pad_all: 8
          scrollable: false
          widgets:
            - label:
                align: LEFT_MID
                text_font: font_icons
                text_color: 0xFFFFFF
                text: "\U000F057E"
            - bar:
                id: volume_bar
                align: LEFT_MID
                x: 40
                width: 150
                height: 12
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x334155
                indicator:
                  bg_color: 0x38BDF8
            - label:
                id: lbl_volume
                align: RIGHT_MID
                text_font: font_small
                text_color: 0xFFFFFF
                text: ""
      # A new firmware was found: install it? While it installs: the progress.
      - obj:
          id: fw_box
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x101828
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 14
          scrollable: false
          widgets:
            - label:
                id: lbl_fw_question
                align: TOP_MID
                y: 20
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
            - button:
                id: btn_fw_yes
                align: BOTTOM_LEFT
                x: 10
                width: 130
                height: 48
                bg_color: 0x15803D
                on_click:
                  - lambda: |-
                      #ifdef USE_UPDATE
                      if (!App.get_updates().empty()) {
                        ESP_LOGI("fw_ui", "Installing the update");
                        lv_obj_add_flag(id(fw_box), LV_OBJ_FLAG_HIDDEN);
                        id(show_ota_screen).execute(0);
                        App.get_updates()[0]->perform();
                      }
                      #endif
                widgets:
                  - label:
                      id: lbl_fw_yes
                      align: CENTER
                      text_font: font_text
                      text_color: 0xFFFFFF
                      text: "Ja"
            - button:
                id: btn_fw_no
                align: BOTTOM_RIGHT
                x: -10
                width: 130
                height: 48
                bg_color: 0x334155
                on_click:
                  - lvgl.widget.hide: fw_box
                widgets:
                  - label:
                      id: lbl_fw_no
                      align: CENTER
                      text_font: font_text
                      text_color: 0xFFFFFF
                      text: "Nein"
      # A short message in the middle (e.g. "the latest firmware is installed"); it goes after 5 s.
      - obj:
          id: toast_box
          hidden: true
          align: CENTER
          width: 280
          height: SIZE_CONTENT
          bg_color: 0x1E293B
          bg_opa: COVER
          border_width: 0
          radius: 12
          pad_all: 16
          scrollable: false
          on_click:
            - lvgl.widget.hide: toast_box
          widgets:
            - label:
                id: lbl_toast
                align: CENTER
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
      # A new firmware is being written: do not switch off (blue).
      - obj:
          id: ota_box
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x1D4ED8
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 16
          scrollable: false
          widgets:
            - label:
                id: lbl_ota_text
                align: TOP_MID
                y: 10
                width: 100%
                long_mode: WRAP
                text_align: CENTER
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
            - bar:
                id: ota_bar
                align: BOTTOM_MID
                y: -40
                width: 260
                height: 14
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x1E3A8A
                indicator:
                  bg_color: 0xFFFFFF
            - label:
                id: lbl_ota_percent
                align: BOTTOM_MID
                y: -6
                text_font: font_text
                text_color: 0xFFFFFF
                text: ""
      # A ringing timer or alarm: a touch anywhere stops it (orange).
      - obj:
          id: ring_box
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0xEA580C
          bg_opa: COVER
          border_width: 0
          radius: 0
          scrollable: false
          on_press:
            - switch.turn_off: timer_ringing
          widgets:
            - label:
                id: lbl_stop
                align: CENTER
                y: -10
                text_font: font_stop
                text_color: 0xFFFFFF
                text: "Stop"
            - label:
                id: lbl_ring_name
                align: BOTTOM_MID
                y: -6
                text_font: font_text
                text_color: 0xFFEDD5
                text: ""
  pages:
    - id: page_clock
      bg_color: 0x000000
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: page_system
            animation: MOVE_RIGHT
            time: 200ms
      on_swipe_left:
        - lvgl.page.show:
            id: page_values
            animation: MOVE_LEFT
            time: 200ms
      widgets:
        - button:
            id: btn_settings
            align: TOP_LEFT
            x: 2
            y: 2
            width: 48
            height: 44
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - lvgl.page.show:
                  id: page_settings
                  animation: FADE_IN
                  time: 150ms
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0x64748B
                  text: "\U000F0493"
        - label:
            id: lbl_alarm
            hidden: true
            align: TOP_MID
            y: 12
            text_font: font_small
            text_color: 0xA78BFA
            text: ""
        - label:
            id: lbl_time
            align: CENTER
            y: -20
            text_font: font_clock
            text_color: 0xFFFFFF
            text: "--:--"
        - label:
            id: lbl_date
            align: CENTER
            y: 60
            width: 100%
            long_mode: DOT
            text_align: CENTER
            text_font: font_date
            text_color: 0xA0A0A0
            text: ""
        - label:
            id: lbl_timer
            hidden: true
            align: BOTTOM_MID
            y: -10
            width: 100%
            long_mode: DOT
            text_align: CENTER
            text_font: font_date
            text_color: 0xFBBF24
            text: ""

    - id: page_system
      bg_color: 0x000000
      scrollable: false
      on_swipe_left:
        - lvgl.page.show:
            id: page_clock
            animation: MOVE_LEFT
            time: 200ms
      widgets:
        - label:
            id: lbl_system_title
            align: TOP_LEFT
            x: 14
            y: 12
            text_font: font_text
            text_color: 0xFFFFFF
            text: "System"
        - label:
            id: lbl_system
            align: TOP_LEFT
            x: 14
            y: 46
            width: 292
            long_mode: WRAP
            text_font: font_small
            text_color: 0xCBD5E1
            text: ""
        - button:
            id: btn_fw
            align: TOP_RIGHT
            x: -46
            y: 6
            height: 36
            bg_color: 0x1E293B
            on_click:
              - script.execute: fw_check
            widgets:
              - label:
                  id: lbl_fw_button
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
                  text: "Firmware-Update"

    - id: page_values
      bg_color: 0x000000
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: page_clock
            animation: MOVE_RIGHT
            time: 200ms
      on_swipe_left:
        - lvgl.page.show:
            id: page_switches
            animation: MOVE_LEFT
            time: 200ms
      widgets:
        - obj:
            align: TOP_LEFT
            x: 6
            y: 8
            width: 150
            height: 108
            bg_color: 0x111827
            border_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  long_mode: DOT
                  width: 128
                  text_font: font_small
                  text_color: 0x94A3B8
                  text: "${value_1_label}"
              - label:
                  id: lbl_value_1
                  align: BOTTOM_LEFT
                  text_font: font_value
                  text_color: 0xFFFFFF
                  text: "–"
        - obj:
            align: TOP_RIGHT
            x: -6
            y: 8
            width: 150
            height: 108
            bg_color: 0x111827
            border_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  long_mode: DOT
                  width: 128
                  text_font: font_small
                  text_color: 0x94A3B8
                  text: "${value_2_label}"
              - label:
                  id: lbl_value_2
                  align: BOTTOM_LEFT
                  text_font: font_value
                  text_color: 0xFFFFFF
                  text: "–"
        - obj:
            align: BOTTOM_LEFT
            x: 6
            y: -8
            width: 150
            height: 108
            bg_color: 0x111827
            border_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  long_mode: DOT
                  width: 128
                  text_font: font_small
                  text_color: 0x94A3B8
                  text: "${value_3_label}"
              - label:
                  id: lbl_value_3
                  align: BOTTOM_LEFT
                  text_font: font_value
                  text_color: 0xFFFFFF
                  text: "–"
        - obj:
            align: BOTTOM_RIGHT
            x: -6
            y: -8
            width: 150
            height: 108
            bg_color: 0x111827
            border_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  long_mode: DOT
                  width: 128
                  text_font: font_small
                  text_color: 0x94A3B8
                  text: "${value_4_label}"
              - label:
                  id: lbl_value_4
                  align: BOTTOM_LEFT
                  text_font: font_value
                  text_color: 0xFFFFFF
                  text: "–"

    # Four switches: a touch switches; on = lit tile.
    - id: page_switches
      bg_color: 0x000000
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: page_values
            animation: MOVE_RIGHT
            time: 200ms
      widgets:
        - button:
            id: tile_sw_1
            align: TOP_LEFT
            x: 6
            y: 8
            width: 150
            height: 108
            bg_color: 0x1E293B
            radius: 10
            shadow_width: 0
            on_click:
              - switch.toggle: switch_1
            widgets:
              - label:
                  align: TOP_LEFT
                  width: 128
                  long_mode: WRAP
                  text_font: font_text
                  text_color: 0xFFFFFF
                  text: "${switch_1_label}"
              - label:
                  id: lbl_sw_1
                  align: BOTTOM_LEFT
