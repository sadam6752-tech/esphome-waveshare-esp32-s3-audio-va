name: Release firmware

# On a tag v*: builds the ready-made firmware (with and without the display), attaches it to the GitHub
# release and publishes the install page and the update manifests on GitHub Pages:
#   https://<owner>.github.io/<repo>/                     install page (ESP Web Tools, flash from Chrome/Edge)
#   https://<owner>.github.io/<repo>/firmware/<variant>/  manifest.json + binaries (OTA updates of the devices)
# GitHub Pages must be set to "GitHub Actions" once (Settings > Pages > Source).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [display, core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}" pyyaml

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Placeholder secrets (the release firmware removes the Wi-Fi of them)
        run: cp secrets.example.yaml secrets.yaml

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-release-${{ matrix.variant }}-${{ env.ESPHOME_VERSION }}

      - name: Compile
        run: >
          esphome -s release_version "${{ steps.version.outputs.version }}"
          -s release_build_path "build/${{ matrix.variant }}"
          compile "release-${{ matrix.variant }}.yaml"

      - name: Collect
        run: |
          mkdir -p out/${{ matrix.variant }}
          cp "$(find build/${{ matrix.variant }} -name firmware.factory.bin | head -1)" out/${{ matrix.variant }}/firmware.factory.bin
          cp "$(find build/${{ matrix.variant }} -name firmware.ota.bin | head -1)" out/${{ matrix.variant }}/firmware.ota.bin
          ls -l out/${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/${{ matrix.variant }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pages and manifests
        id: pages
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          python3 scripts/release_manifest.py --version "$v" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$v" \
            --artifacts artifacts --site site
          cp install/index.html site/index.html
          mkdir -p assets
          for variant in display core; do
            cp "site/firmware/$variant/firmware.factory.bin" "assets/waveshare-va-$variant-$v.factory.bin"
            cp "site/firmware/$variant/firmware.ota.bin" "assets/waveshare-va-$variant-$v.ota.bin"
          done
          find site assets -type f

      - name: Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
